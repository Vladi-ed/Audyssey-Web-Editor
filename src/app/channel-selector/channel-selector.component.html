<mat-radio-group
    class="channel-radio-group"
    [value]="selectedChannel()"
    (change)="selectedChannel.set($event.value)"
>
    @for (channel of detectedChannels(); track (channel.enChannelType || $index)) {
        <mat-radio-button class="channel-radio-button" [value]="channel">
            {{ channel.commandId | decodeChannelName }}
        </mat-radio-button>
    }
</mat-radio-group>
